
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#100713">

    <title>DEEPOTSAV 2026 | Festival of Lights</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #ffd477;
            --gold2: #ffb347;
            --saffron: #ff8b35;
            --pink: #ff4e91;
            --purple: #a45bff;
            --bg: #100713;
            --panel: rgba(38, 19, 42, .75);
            --muted: #c9afc5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background: var(--bg);
            color: white;
            font-family: 'DM Sans', sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -30%;
            z-index: -4;
            background:
                    radial-gradient(circle at 20% 30%, #9b283b40, transparent 35%),
                    radial-gradient(circle at 80% 20%, #7227a340, transparent 35%),
                    radial-gradient(circle at 50% 80%, #ff831b30, transparent 40%);
            animation: atmosphere 14s ease-in-out infinite alternate;
        }

        @keyframes atmosphere {
            to {
                transform: translate(4%, 3%) scale(1.15);
            }
        }

        #particles,
        #fireworks {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #particles {
            z-index: -2;
        }

        #fireworks {
            z-index: 8;
        }

        .top-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            z-index: 20;
            background: linear-gradient(
                    90deg,
                    #ff7a18,
                    #ffd477,
                    #ff4e91,
                    #a45bff,
                    #ff7a18
            );
            background-size: 300%;
            animation: rainbow 5s linear infinite;
        }

        @keyframes rainbow {
            to { background-position: 300% 0; }
        }

        .orb {
            position: fixed;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: .18;
            pointer-events: none;
            z-index: -3;
        }

        .orb.one {
            background: var(--saffron);
            left: -120px;
            top: 20%;
            animation: orbMove 10s infinite alternate;
        }

        .orb.two {
            background: var(--purple);
            right: -120px;
            bottom: 10%;
            animation: orbMove 12s infinite alternate-reverse;
        }

        @keyframes orbMove {
            to { transform: translate(80px, 60px) scale(1.4); }
        }

        nav {
            width: min(1150px, 90%);
            margin: auto;
            padding: 28px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 23px;
            letter-spacing: 4px;
            font-weight: 700;
        }

        .nav-label {
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 3px;
        }

        main {
            min-height: 82vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px 20px 80px;
        }

        .hero {
            width: 100%;
            max-width: 820px;
            text-align: center;
            animation: reveal 1s ease both;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(35px);
                filter: blur(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .eyebrow {
            color: var(--gold);
            font-size: 10px;
            letter-spacing: 5px;
            line-height: 2;
            margin-bottom: 25px;
        }

        .diya {
            display: inline-block;
            font-size: 70px;
            margin-bottom: 22px;
            filter: drop-shadow(0 0 25px #ff9d3d);
            animation: diyaFloat 3s ease-in-out infinite;
        }

        @keyframes diyaFloat {
            0%,100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(43px, 9vw, 88px);
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(
                    100deg,
                    #fff0c2,
                    #ffc45c,
                    #fff3d4,
                    #ff9b52,
                    #ffd477
            );
            background-size: 250% auto;
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;
            animation: goldFlow 5s linear infinite;
        }

        @keyframes goldFlow {
            to { background-position: 250% center; }
        }

        .subtitle {
            max-width: 560px;
            margin: 22px auto 0;
            color: #ddc8dc;
            font-size: 15px;
            line-height: 1.9;
        }

        .divider {
            width: 110px;
            height: 1px;
            margin: 30px auto;
            background: linear-gradient(
                    90deg,
                    transparent,
                    var(--gold),
                    transparent
            );
        }

        .quote {
            color: #f4d9a4;
            font-family: 'Cinzel', serif;
            font-size: 14px;
            letter-spacing: 1px;
            line-height: 2;
        }

        .enter-btn {
            margin-top: 35px;
            padding: 17px 32px;
            border: 1px solid #ffcd7c;
            border-radius: 50px;
            background: linear-gradient(
                    120deg,
                    #ff9b3d,
                    #e85d50,
                    #a84985
            );
            color: white;
            font-size: 11px;
            letter-spacing: 2px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 25px #ff8b3540;
            transition: .35s ease;
        }

        .enter-btn:hover {
            transform: translateY(-5px) scale(1.04);
            box-shadow: 0 0 45px #ff9b3d90;
        }

        .enter-btn:active {
            transform: scale(.97);
        }

        .bottom-note {
            margin-top: 60px;
            color: #987c91;
            font-size: 10px;
            letter-spacing: 3px;
        }

        footer {
            padding: 25px;
            text-align: center;
            color: #987c91;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .question-card {
            width: min(620px, 100%);
            margin: auto;
            padding: 35px 25px;
            border: 1px solid #ffd47745;
            border-radius: 25px;
            background: var(--panel);
            box-shadow: 0 20px 90px #0005, 0 0 40px #ff9b3d0c;
            backdrop-filter: blur(18px);
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background: #ffffff18;
            border-radius: 20px;
            margin: 25px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(
                    90deg,
                    var(--saffron),
                    var(--gold),
                    var(--pink)
            );
            border-radius: 20px;
            transition: width .5s ease;
        }

        .question-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(23px, 5vw, 36px);
            color: var(--gold);
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .question-description {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .name-input {
            display: block;
            width: 100%;
            padding: 17px 20px;
            border: 1px solid #ffd47770;
            border-radius: 14px;
            background: #160d1b;
            color: white;
            font-size: 16px;
            outline: none;
            transition: .3s;
        }

        .name-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 20px #ffd47725;
        }

        .option-list {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }

        .option-btn {
            width: 100%;
            padding: 17px 18px;
            text-align: left;
            border: 1px solid #ffffff20;
            border-radius: 13px;
            background: #ffffff08;
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: .3s ease;
        }

        .option-btn:hover {
            border-color: var(--gold);
            background: #ffb34718;
            transform: translateX(5px);
        }

        .option-btn.selected {
            border-color: var(--gold);
            background: #ffb34728;
            box-shadow: 0 0 20px #ffb34715;
        }

        .question-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 28px;
        }

        .back-btn {
            padding: 14px 20px;
            background: transparent;
            border: 1px solid #ffffff35;
            color: #d9c4d4;
            border-radius: 30px;
            cursor: pointer;
        }

        .continue-btn {
            padding: 14px 25px;
            border: 1px solid var(--gold);
            background: linear-gradient(120deg,#ff9b3d,#a84985);
            color: white;
            border-radius: 30px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: .3s;
        }

        .continue-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 25px #ff9b3d60;
        }

        .step-label {
            color: #bd9fb5;
            font-size: 11px;
            letter-spacing: 2px;
            margin-top: 20px;
        }

        .error {
            color: #ff91a8;
            font-size: 12px;
            margin-top: 12px;
            min-height: 18px;
        }

        .celebration-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(35px, 8vw, 75px);
            line-height: 1.3;
            background: linear-gradient(90deg,#fff0c2,#ffae42,#ff4e91,#c38aff);
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;
            background-size: 200%;
            animation: goldFlow 4s linear infinite;
        }

        .final-message {
            color: #e5cde0;
            font-size: 15px;
            line-height: 2;
            max-width: 570px;
            margin: 25px auto;
        }

        .final-details {
            display: inline-block;
            padding: 17px 24px;
            margin-top: 15px;
            border: 1px solid #ffd47745;
            border-radius: 16px;
            background: #ffffff08;
            color: #ffdb9a;
            font-size: 13px;
            line-height: 2;
        }

        .fireworks-btn {
            margin: 15px 8px 0;
            padding: 15px 22px;
            border-radius: 40px;
            border: 1px solid var(--gold);
            color: white;
            background: #ffffff10;
            cursor: pointer;
            font-weight: 700;
            transition: .3s;
        }

        .fireworks-btn:hover {
            background: #ff9b3d30;
            transform: scale(1.05);
        }

        .screen-transition {
            animation: screenIn .65s cubic-bezier(.2,.8,.2,1) both;
        }

        @keyframes screenIn {
            from {
                opacity: 0;
                transform: translateY(25px) scale(.98);
                filter: blur(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @media(max-width:600px) {
            nav {
                padding: 22px 0;
            }

            .logo {
                font-size: 17px;
                letter-spacing: 2px;
            }

            .nav-label {
                font-size: 8px;
                letter-spacing: 1px;
            }

            main {
                min-height: 78vh;
                padding: 30px 15px 60px;
            }

            .question-card {
                padding: 27px 18px;
            }

            .eyebrow {
                letter-spacing: 3px;
                font-size: 9px;
            }

            .diya {
                font-size: 55px;
            }

            .subtitle {
                font-size: 13px;
            }

            .question-actions {
                flex-wrap: wrap;
            }

            .question-actions button {
                flex: 1;
            }
        }

        @media(prefers-reduced-motion:reduce) {
            *,*::before,*::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>

<div class="top-line"></div>

<canvas id="particles"></canvas>
<canvas id="fireworks"></canvas>

<div class="orb one"></div>
<div class="orb two"></div>

<nav>
    <div class="logo">DEEPOTSAV.</div>
    <div class="nav-label">THE FESTIVAL OF LIGHTS ✦ 2026</div>
</nav>

<main>
    <section class="hero" id="app"></section>
</main>

<footer>
    MAY EVERY HEART FIND ITS LIGHT • HAPPY DIWALI 2026
</footer>

<script>
    "use strict";

    /* ==================================
       DEEPOTSAV APPLICATION
    ================================== */

    const app = document.getElementById("app");

    const answers = {
        name: "",
        excitement: "",
        favourite: "",
        company: ""
    };

    let currentStep = 0;

    const questions = [
        {
            key: "excitement",
            title: "How excited are you for Diwali?",
            description: "Tell us how much festival magic is in the air!",
            options: [
                "SUPER EXCITED! 🎆",
                "CAN'T WAIT FOR THE LIGHTS! 🪔",
                "READY FOR ALL THE FUN! 🎉",
                "BRING ON THE FESTIVAL MAGIC! ✨"
            ]
        },
        {
            key: "favourite",
            title: "What's your favourite part of Diwali?",
            description: "Every celebration has its own special magic.",
            options: [
                "Beautiful diyas and decorations 🪔",
                "Rangoli and colourful designs 🎨",
                "Sweets and delicious food 🍬",
                "Family, friends and celebrations ❤️",
                "Lights and fireworks displays 🎆"
            ]
        },
        {
            key: "company",
            title: "Who are you celebrating with?",
            description: "The people who make your festival special.",
            options: [
                "My family ❤️",
                "My friends 🎉",
                "Everyone together! 🪔",
                "A peaceful celebration with myself ✨"
            ]
        }
    ];

    /* ==================================
       WELCOME SCREEN
    ================================== */

    function showWelcome() {
        app.innerHTML = `
        <div class="eyebrow">
            ✦ A CELEBRATION OF LIGHT, LOVE & HAPPINESS ✦
        </div>

        <div class="diya">🪔</div>

        <h1>DEEPOTSAV</h1>

        <p class="subtitle">
            A little festival magic, a little sparkle,
            and a whole lot of happiness.

            Something beautiful is waiting for you.
        </p>

        <div class="divider"></div>

        <p class="quote">
            "Let the light within you shine brighter
            than the lights around you."
        </p>

        <button class="enter-btn" id="enterBtn">
            ENTER THE CELEBRATION ✨
        </button>

        <div class="bottom-note">
            MADE WITH LIGHT & LOVE
        </div>
    `;

        document.getElementById("enterBtn")
            .addEventListener("click", () => {
                currentStep = 0;
                renderStep();
            });
    }

    /* ==================================
       QUESTIONNAIRE
    ================================== */

    function renderStep() {
        const totalSteps = questions.length + 1;

        app.classList.remove("screen-transition");

        if (currentStep === 0) {
            app.innerHTML = `
            <div class="eyebrow">
                ✦ YOUR PERSONAL DIWALI EXPERIENCE ✦
            </div>

            <div class="diya">🪔</div>

            <div class="question-card screen-transition">
                <div class="step-label">WELCOME • STEP 1 OF ${totalSteps}</div>

                <div class="progress-track">
                    <div class="progress-fill" style="width:25%"></div>
                </div>

                <h2 class="question-title">
                    What should we call you?
                </h2>

                <p class="question-description">
                    Every beautiful celebration deserves a personal touch.
                </p>

                <input
                    class="name-input"
                    id="nameInput"
                    type="text"
                    maxlength="35"
                    autocomplete="given-name"
                    placeholder="Enter your name..."
                >

                <div class="error" id="error"></div>

                <div class="question-actions">
                    <span></span>
                    <button class="continue-btn" id="continueBtn">
                        LET'S GO ✨
                    </button>
                </div>
            </div>
        `;

            const input = document.getElementById("nameInput");

            input.value = answers.name;

            document.getElementById("continueBtn")
                .addEventListener("click", () => {
                    const name = input.value.trim();

                    if (!name) {
                        document.getElementById("error").textContent =
                            "Please enter your name to continue.";

                        input.focus();
                        return;
                    }

                    answers.name = name;
                    currentStep++;
                    renderStep();
                });

            input.addEventListener("keydown", event => {
                if (event.key === "Enter") {
                    document.getElementById("continueBtn").click();
                }
            });

            return;
        }

        const question = questions[currentStep - 1];
        const progress = Math.round(
            ((currentStep + 1) / totalSteps) * 100
        );

        app.innerHTML = `
        <div class="eyebrow">
            ✦ YOUR DIWALI JOURNEY ✦
        </div>

        <div class="diya">✨</div>

        <div class="question-card screen-transition">

            <div class="step-label">
                QUESTION ${currentStep + 1} OF ${totalSteps}
            </div>

            <div class="progress-track">
                <div class="progress-fill" style="width:${progress}%"></div>
            </div>

            <h2 class="question-title">
                ${question.title}
            </h2>

            <p class="question-description">
                ${question.description}
            </p>

            <div class="option-list">
                ${question.options.map((option, index) => `
                    <button
                        class="option-btn ${
            answers[question.key] === option
                ? "selected" : ""
        }"
                        data-index="${index}"
                        type="button"
                    >
                        ${option}
                    </button>
                `).join("")}
            </div>

            <div class="error" id="error"></div>

            <div class="question-actions">
                <button class="back-btn" id="backBtn">
                    ← BACK
                </button>

                <button class="continue-btn" id="continueBtn">
                    ${currentStep === questions.length
            ? "REVEAL MY DIWALI ✨"
            : "CONTINUE →"}
                </button>
            </div>

        </div>
    `;

        app.querySelectorAll(".option-btn").forEach(button => {
            button.addEventListener("click", () => {
                answers[question.key] =
                    question.options[Number(button.dataset.index)];

                app.querySelectorAll(".option-btn")
                    .forEach(option => option.classList.remove("selected"));

                button.classList.add("selected");

                document.getElementById("error").textContent = "";
            });
        });

        document.getElementById("backBtn")
            .addEventListener("click", () => {
                currentStep--;
                renderStep();
            });

        document.getElementById("continueBtn")
            .addEventListener("click", () => {
                if (!answers[question.key]) {
                    document.getElementById("error").textContent =
                        "Choose an option to continue. ✨";
                    return;
                }

                currentStep++;

                if (currentStep > questions.length) {
                    showCelebration();
                } else {
                    renderStep();
                }
            });
    }

    /* ==================================
       GRAND DIWALI REVEAL
    ================================== */

    function showCelebration() {
        app.innerHTML = `
        <div class="screen-transition">

            <div class="eyebrow">
                ✦ YOUR PERSONAL DIWALI CELEBRATION ✦
            </div>

            <div class="diya">🪔</div>

            <h1 class="celebration-title">
                HAPPY DIWALI!
            </h1>

            <h2 class="question-title" style="margin-top:15px">
                ${escapeHtml(answers.name)} ✨
            </h2>

            <p class="final-message">
                May your Diwali be filled with happiness,
                beautiful memories, endless light and
                countless reasons to smile.

                May this festival bring fresh beginnings
                and wonderful moments into your life.
            </p>

            <div class="divider"></div>

            <div class="final-details">
                <strong>YOUR DIWALI VIBE</strong><br>
                ${escapeHtml(answers.excitement)}<br>
                ${escapeHtml(answers.favourite)}<br>
                Celebrating with: ${escapeHtml(answers.company)}
            </div>

            <div>
                <br>
                <button class="fireworks-btn" id="fireworksBtn">
                    🎆 LAUNCH FIREWORKS
                </button>

                <button class="fireworks-btn" id="restartBtn">
                    ↻ CELEBRATE AGAIN
                </button>
            </div>

            <div class="bottom-note">
                MADE WITH LIGHT & LOVE • DEEPOTSAV 2026
            </div>
        </div>
    `;

        launchFireworks();

        document.getElementById("fireworksBtn")
            .addEventListener("click", launchFireworks);

        document.getElementById("restartBtn")
            .addEventListener("click", () => {
                answers.name = "";
                answers.excitement = "";
                answers.favourite = "";
                answers.company = "";

                currentStep = 0;

                showWelcome();
            });
    }

    /* ==================================
       SAFE TEXT OUTPUT
    ================================== */

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);
    }

    /* ==================================
       FLOATING LIGHT PARTICLES
    ================================== */

    const particleCanvas = document.getElementById("particles");
    const particleCtx = particleCanvas.getContext("2d");

    let particles = [];

    const particleColors = [
        "#ffd477",
        "#ff9b52",
        "#ff6e91",
        "#c38aff"
    ];

    function resizeCanvas(canvas, ctx) {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;

        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    class Particle {
        constructor() {
            this.reset(true);
        }

        reset(initial = false) {
            this.x = Math.random() * window.innerWidth;

            this.y = initial
                ? Math.random() * window.innerHeight
                : window.innerHeight + 10;

            this.size = Math.random() * 2.3 + .5;
            this.speed = Math.random() * .5 + .15;
            this.opacity = Math.random() * .6 + .2;
            this.phase = Math.random() * Math.PI * 2;

            this.color = particleColors[
                Math.floor(Math.random() * particleColors.length)
                ];
        }

        update() {
            this.y -= this.speed;
            this.x += Math.sin(this.phase) * .3;
            this.phase += .015;

            if (this.y < -10) {
                this.reset();
            }
        }

        draw() {
            particleCtx.save();

            particleCtx.globalAlpha = this.opacity;
            particleCtx.fillStyle = this.color;
            particleCtx.shadowBlur = 15;
            particleCtx.shadowColor = this.color;

            particleCtx.beginPath();
            particleCtx.arc(
                this.x,
                this.y,
                this.size,
                0,
                Math.PI * 2
            );

            particleCtx.fill();
            particleCtx.restore();
        }
    }

    function initParticles() {
        resizeCanvas(particleCanvas, particleCtx);

        const count = Math.min(
            110,
            Math.floor(window.innerWidth / 9)
        );

        particles = Array.from(
            { length: count },
            () => new Particle()
        );
    }

    function animateParticles() {
        particleCtx.clearRect(
            0,
            0,
            window.innerWidth,
            window.innerHeight
        );

        particles.forEach(particle => {
            particle.update();
            particle.draw();
        });

        requestAnimationFrame(animateParticles);
    }

    /* ==================================
       INTERACTIVE FIREWORKS
    ================================== */

    const fireworksCanvas = document.getElementById("fireworks");
    const fireworksCtx = fireworksCanvas.getContext("2d");

    let fireworks = [];
    let lastFireworkTime = 0;

    class FireworkParticle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;

            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5 + 1;

            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;

            this.life = 1;
            this.decay = Math.random() * .018 + .012;
            this.size = Math.random() * 2.5 + 1;
            this.color = color;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;

            this.vx *= .98;
            this.vy *= .98;
            this.vy += .035;

            this.life -= this.decay;
        }

        draw() {
            fireworksCtx.save();

            fireworksCtx.globalAlpha = Math.max(0, this.life);
            fireworksCtx.fillStyle = this.color;
            fireworksCtx.shadowBlur = 12;
            fireworksCtx.shadowColor = this.color;

            fireworksCtx.beginPath();
            fireworksCtx.arc(
                this.x,
                this.y,
                this.size,
                0,
                Math.PI * 2
            );

            fireworksCtx.fill();
            fireworksCtx.restore();
        }
    }

    function launchOneFirework(x, y) {
        const colors = [
            "#ffd477",
            "#ff8b35",
            "#ff4e91",
            "#a45bff",
            "#ffffff",
            "#16e0b0"
        ];

        const color = colors[
            Math.floor(Math.random() * colors.length)
            ];

        for (let i = 0; i < 65; i++) {
            fireworks.push(
                new FireworkParticle(x, y, color)
            );
        }
    }

    function launchFireworks() {
        for (let i = 0; i < 5; i++) {
            setTimeout(() => {
                launchOneFirework(
                    window.innerWidth * (.15 + Math.random() * .7),
                    window.innerHeight * (.15 + Math.random() * .45)
                );
            }, i * 250);
        }
    }

    function animateFireworks(timestamp) {
        fireworksCtx.clearRect(
            0,
            0,
            window.innerWidth,
            window.innerHeight
        );

        if (timestamp - lastFireworkTime > 1000) {
            if (Math.random() > .65) {
                launchOneFirework(
                    Math.random() * window.innerWidth,
                    Math.random() * window.innerHeight * .55
                );
            }

            lastFireworkTime = timestamp;
        }

        fireworks.forEach(particle => {
            particle.update();
            particle.draw();
        });

        fireworks = fireworks.filter(
            particle => particle.life > 0
        );

        requestAnimationFrame(animateFireworks);
    }

    /* ==================================
       START APPLICATION
    ================================== */

    window.addEventListener("resize", () => {
        initParticles();
        resizeCanvas(fireworksCanvas, fireworksCtx);
    });

    initParticles();

    resizeCanvas(fireworksCanvas, fireworksCtx);

    animateParticles();
    animateFireworks();

    showWelcome();

</script>

</body>
</html>
